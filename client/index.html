<!doctype html>
<html lang="en" class="is-starting">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#100e16" />
  <meta name="description" content="NEIROSLOP BURMALDA — eight immersive virtual-coin games and a little Miami magic." />
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('lounge-theme')==='light'?'light':'dark'}catch{document.documentElement.dataset.theme='dark'}</script>
  <title>NEIROSLOP BURMALDA — Virtual Casino</title>
  <link rel="icon" href="/favicon.svg" />
  <link rel="preload" as="image" href="/assets/neiroslop-logo.png" />
  <link rel="preload" as="image" href="/assets/miami-startup.png" media="(min-width:651px)" />
  <link rel="preload" as="image" href="/assets/miami-startup-mobile.png" media="(max-width:650px)" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;550;600;650;700&family=Outfit:wght@400;500;550;600;650;700;750;800&display=swap" rel="stylesheet" />
  <style>
    html.is-starting,html.is-starting body{overflow:hidden}
    #startup-screen{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;overflow:hidden;background:#17142f;color:#fff;font-family:Arial,sans-serif;isolation:isolate;transition:opacity .65s ease,visibility .65s}
    #startup-screen.startup-leaving{opacity:0;visibility:hidden;pointer-events:none}
    .startup-art{position:absolute;inset:0;z-index:-3}
    .startup-art img{width:100%;height:100%;object-fit:cover;object-position:center;animation:miami-drift 12s ease-out both}
    .startup-shade{position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,#1414335e,transparent 35%,#17143333 65%,#11112cbd),radial-gradient(ellipse at 50% 43%,#100d244d,transparent 65%)}
    .startup-haze{position:absolute;inset:-15%;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 22% 45%,#fe58c426,transparent 40%),radial-gradient(ellipse at 78% 55%,#2be9ee1c,transparent 40%);animation:neon-breathe 4s ease-in-out infinite alternate}
    .startup-content{width:min(92vw,1050px);display:flex;flex-direction:column;align-items:center;text-align:center;transform:translateY(-2vh)}
    .startup-kicker{display:flex;align-items:center;gap:13px;margin:0;color:#fff3e1;font-size:9px;letter-spacing:4px;font-weight:500;text-shadow:0 2px 8px #0f122c;animation:intro-rise .75s .1s both}
    .startup-kicker:before,.startup-kicker:after{content:'';width:38px;height:1px;background:linear-gradient(90deg,transparent,#ffd6ca)}
    .startup-kicker:after{transform:rotate(180deg)}
    .startup-title{width:100%;margin:22px 0 14px;line-height:0;animation:logo-arrival 1.1s cubic-bezier(.2,.7,.3,1) both}
    .startup-title img{display:block;margin:auto;width:min(100%,900px);height:auto;max-height:54vh;object-fit:contain;filter:drop-shadow(0 15px 30px #080c3780) drop-shadow(0 0 30px #ff82d21f)}
    .startup-subtitle{margin:0;color:#fff1eb;font-size:11px;letter-spacing:2.3px;text-shadow:0 2px 12px #100e29;animation:intro-rise .8s .4s both}
    .startup-loading{margin-top:35px;display:flex;flex-direction:column;align-items:center;gap:13px;animation:intro-rise .8s .55s both}
    .startup-loading>span:last-child{font-size:8px;letter-spacing:2.6px;color:#f0d8ef;text-shadow:0 2px 7px #1e102a}
    .startup-loading-track{position:relative;display:block;width:160px;height:2px;overflow:hidden;border-radius:4px;background:#fce2ff30;box-shadow:0 0 10px #eb92ca1a}
    .startup-loading-track i{display:block;position:absolute;inset:0 auto 0 0;width:60%;background:linear-gradient(90deg,transparent,#93f8f0,#ffc7e5,transparent);box-shadow:0 0 9px #b3fff1;animation:loading-sweep 1.6s ease-in-out infinite}
    #startup-skip{position:absolute;right:35px;top:28px;border:1px solid #fff5;background:#15162c3b;color:#fff5ee;padding:10px 16px;border-radius:25px;font:10px Arial,sans-serif;letter-spacing:.5px;cursor:pointer;backdrop-filter:blur(10px)}
    #startup-skip:hover{background:#fff2;border-color:#fff9}
    #startup-skip:focus-visible{outline:2px solid #9ff6ec;outline-offset:4px}
    .startup-footer{position:absolute;bottom:27px;left:35px;right:35px;display:flex;justify-content:space-between;gap:20px;font-size:7px;letter-spacing:2px;color:#f9e2f0;text-shadow:0 2px 8px #1b1234}
    @keyframes miami-drift{from{transform:scale(1.07)}to{transform:scale(1)}}
    @keyframes logo-arrival{from{opacity:0;transform:translateY(22px) scale(.94);filter:blur(4px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
    @keyframes intro-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes loading-sweep{from{transform:translateX(-110%)}to{transform:translateX(190%)}}
    @keyframes neon-breathe{to{opacity:.55;transform:translateX(2%)}}
    @media(max-width:650px){.startup-content{width:94vw;transform:translateY(-3vh)}.startup-title{margin:25px 0 20px}.startup-title img{max-height:45vh}.startup-kicker{font-size:7px;letter-spacing:2.4px;gap:9px}.startup-kicker:before,.startup-kicker:after{width:22px}.startup-subtitle{font-size:8px;letter-spacing:1.5px}.startup-loading{margin-top:30px}.startup-loading>span:last-child{font-size:7px;letter-spacing:2px}#startup-skip{top:20px;right:18px;font-size:9px;padding:9px 13px}.startup-footer{left:20px;right:20px;bottom:23px;justify-content:center;font-size:6px;letter-spacing:1.3px}.startup-footer>span:last-child{display:none}}
    @media(prefers-reduced-motion:reduce){#startup-screen,#startup-screen *{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <section id="startup-screen" aria-label="Welcome to NEIROSLOP BURMALDA">
    <picture class="startup-art" aria-hidden="true"><source media="(max-width:650px)" srcset="/assets/miami-startup-mobile.png" /><img src="/assets/miami-startup.png" alt="" fetchpriority="high" /></picture>
    <div class="startup-shade"></div><div class="startup-haze"></div>
    <button id="startup-skip" type="button">Skip intro <span aria-hidden="true">↗</span></button>
    <div class="startup-content">
      <p class="startup-kicker">MIAMI NIGHTS · VIRTUAL COINS</p>
      <h1 class="startup-title"><img src="/assets/neiroslop-logo.png" alt="NEIROSLOP BURMALDA" width="1792" height="896" fetchpriority="high" /></h1>
      <p class="startup-subtitle">A LITTLE NEON. A WORLD OF POSSIBILITY.</p>
      <div class="startup-loading" role="status"><span class="startup-loading-track" aria-hidden="true"><i></i></span><span>SETTING THE SCENE</span></div>
    </div>
    <div class="startup-footer"><span>100% VIRTUAL COINS · MADE FOR PLAY</span><span>PALMS · SKYLINES · GOOD TIMES</span></div>
  </section>
  <div id="root" inert aria-hidden="true"></div>
  <noscript><p style="padding:3rem;text-align:center;font-family:sans-serif">Enable JavaScript to explore NEIROSLOP BURMALDA.</p><style>#startup-screen{display:none}</style></noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
